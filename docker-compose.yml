services:
  postgres:
    image: postgres:16
    container_name: ds_interview_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ds_candidate
      POSTGRES_PASSWORD: ds_candidate_pw
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds_candidate -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10
  pgadmin_panel:
    image: dpage/pgadmin4
    container_name: ds_interview_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: yourpassword
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
  adminer:
    image: adminer
    container_name: ds_interview_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
