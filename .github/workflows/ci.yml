name: CI

on:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check pipeline serving training monitoring

      - name: Unit tests - pipeline (feature engineering)
        run: pytest pipeline/test_transform.py -v

      - name: Unit tests - serving (API)
        run: pytest serving/test_app.py -v

  build-and-smoke-test:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f serving/Dockerfile -t churn-api:ci .

      - name: Run container
        run: |
          docker run -d --name churn-api -p 8000:8000 \
            -e MLFLOW_TRACKING_URI=http://127.0.0.1:1 \
            -e MLFLOW_HTTP_REQUEST_MAX_RETRIES=1 \
            -e MLFLOW_HTTP_REQUEST_BACKOFF_FACTOR=0 \
            churn-api:ci

      - name: Wait for container to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker logs churn-api
          exit 1

      - name: Smoke test - /health
        run: |
          curl -sf http://localhost:8000/health | tee health.json
          grep -q '"status"' health.json

      - name: Smoke test - /predict
        run: |
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"order_count": 5, "total_spend": 250.0, "distinct_products": 3, "recency_days": 40, "tenure_days": 300}' \
            -o predict_response.json -w "%{http_code}" | tee status_code.txt
          test "$(cat status_code.txt)" = "200"

      - name: Container logs (on failure)
        if: failure()
        run: docker logs churn-api

      - name: Stop container
        if: always()
        run: docker rm -f churn-api

  # Bonus: manual-approval gate for prod deploy. Requires a GitHub
  # Environment named "production" configured with required reviewers.
  deploy-to-prod:
    runs-on: ubuntu-latest
    needs: build-and-smoke-test
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Build and tag release image
        run: docker build -f serving/Dockerfile -t churn-api:${{ github.sha }} .
      - name: Push to registry
        run: echo "Push churn-api:${{ github.sha }} to your container registry here (e.g. docker push, or az acr login && docker push)."
